// Test-only output redirection; does not change application behavior.
def out = new File(System.getenv('H02_BUILD_ROOT'))
gradle.beforeProject { p ->
    p.layout.buildDirectory.set(new File(out, p.path == ':' ? 'root' : p.path.substring(1).replace(':', '/')))
    p.plugins.withId('com.android.application') {
        p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
            dsl.defaultConfig.ndk.abiFilters.clear()
            dsl.defaultConfig.ndk.abiFilters.add('x86_64')
            def signing = dsl.signingConfigs.getByName('debug')
            signing.storeFile = new File(out.parentFile, 'signing/debug.keystore')
            signing.storeType = 'PKCS12'
            signing.storePassword = 'android'
            signing.keyAlias = 'androiddebugkey'
            signing.keyPassword = 'android'
        }
    }
}
